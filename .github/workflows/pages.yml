name: Publish reports

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; never cancel one mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Run tests with coverage
        run: >
          npx c8
          --reporter=html --reporter=json-summary
          --report-dir=public/coverage
          --
          npx cucumber-js 'specs/features/**/*.feature'
          --require-module ts-node/register
          --require 'test/steps/**/*.ts'
          --require 'test/support/**/*.ts'
          --format progress
          --format html:public/tests/index.html
          --format json:public/tests/report.json

      # Full mutation run (no --mutate filter): this workflow only runs on master, where there's
      # no PR base branch to diff against, so the whole library is mutated. The break threshold
      # is overridden to 0 so a low score never aborts the publish step, since this workflow only
      # reports the score, it doesn't gate anything - the PR gate (pr_master.yml) already enforces
      # the threshold before code reaches master.
      - name: Run mutation tests
        run: |
          jq '.thresholds.break = 0
              | .reporters = ["html", "json", "clear-text"]
              | .htmlReporter.fileName = "public/mutation/reports/mutation-report.html"
              | .jsonReporter.fileName = "public/mutation/reports/mutation-report.json"' \
            stryker.conf.json > stryker.pages.json
          npx stryker run stryker.pages.json

      - name: Assemble GitHub Pages site
        run: |
          cp .github/pages/index.html public/index.html

          COVERAGE_PCT=$(jq '.total.lines.pct' public/coverage/coverage-summary.json)
          COVERAGE_COLOR=$(awk -v s="$COVERAGE_PCT" 'BEGIN { if (s >= 80) print "brightgreen"; else if (s >= 60) print "yellowgreen"; else print "red" }')
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}' "$COVERAGE_PCT" "$COVERAGE_COLOR" > public/coverage-badge.json

          MUTATION_JSON=public/mutation/reports/mutation-report.json
          KILLED=$(jq '[.files[].mutants[].status] | map(select(. == "Killed")) | length' "$MUTATION_JSON")
          SURVIVED=$(jq '[.files[].mutants[].status] | map(select(. == "Survived")) | length' "$MUTATION_JSON")
          TIMEDOUT=$(jq '[.files[].mutants[].status] | map(select(. == "Timeout")) | length' "$MUTATION_JSON")
          NOCOVERAGE=$(jq '[.files[].mutants[].status] | map(select(. == "NoCoverage")) | length' "$MUTATION_JSON")
          TESTED=$((KILLED + SURVIVED + TIMEDOUT + NOCOVERAGE))
          if [ "$TESTED" -eq 0 ]; then
            SCORE="0.0"
          else
            SCORE=$(awk -v k="$KILLED" -v t="$TESTED" 'BEGIN { printf "%.1f", (k / t) * 100 }')
          fi
          MUTATION_COLOR=$(awk -v s="$SCORE" 'BEGIN { if (s >= 80) print "brightgreen"; else if (s >= 60) print "yellowgreen"; else print "red" }')
          printf '{"schemaVersion":1,"label":"mutation score","message":"%s%%","color":"%s"}' "$SCORE" "$MUTATION_COLOR" > public/mutation-badge.json

          TESTS_JSON=public/tests/report.json
          TOTAL=$(jq '[.[].elements[]] | length' "$TESTS_JSON")
          PASSED=$(jq '[.[].elements[] | select(all(.steps[]; .result.status == "passed"))] | length' "$TESTS_JSON")
          TESTS_COLOR="red"
          [ "$PASSED" = "$TOTAL" ] && TESTS_COLOR="brightgreen"
          printf '{"schemaVersion":1,"label":"tests","message":"%s/%s passed","color":"%s"}' "$PASSED" "$TOTAL" "$TESTS_COLOR" > public/tests-badge.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build-reports
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
