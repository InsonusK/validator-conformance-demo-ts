name: Publish reports

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; never cancel one mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  cucumber-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Run Cucumber tests with coverage
        run: make cucumber-test WITH_CODE_COVERAGE=true

      - uses: actions/upload-artifact@v4
        with:
          name: cucumber-test-report
          path: |
            tmp/result
            tmp/report/tests
            tmp/report/coverage
          if-no-files-found: error

  mutation-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # Full run (no ONLY_DELTA): this workflow only runs on master, where there's no PR
      # base branch to diff against, so the whole library is mutated. It never gates
      # (see mutation-test.sh) since this workflow only reports the score - the PR gate
      # (pr_master.yml) already enforces the threshold before code reaches master.
      - name: Run mutation tests
        run: make mutation-test

      - uses: actions/upload-artifact@v4
        with:
          name: mutation-test-report
          path: |
            tmp/result
            tmp/report/mutation
          if-no-files-found: error

  result-page:
    needs: [cucumber-test, mutation-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # upload-artifact uses the least common ancestor of each job's upload paths (tmp/…)
      # as the artifact root, so it strips the "tmp/" prefix - download back into "tmp" to
      # restore it, matching what result-page.sh expects (tmp/result, tmp/report).
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-test-report"
          merge-multiple: true
          path: tmp

      - name: Assemble GitHub Pages site
        run: make result-page

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: result-page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
