name: PR master

on:
  pull_request:
    branches:
      - master

jobs:
  cucumber:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
      - run: npm test

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
      - run: npx stryker run --since=${{ github.event.pull_request.base.sha }}

  test:
    name: test-result
    needs: [cucumber, mutation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.cucumber.result }}" != "success" ] || [ "${{ needs.mutation.result }}" != "success" ]; then
            echo "cucumber: ${{ needs.cucumber.result }}"
            echo "mutation: ${{ needs.mutation.result }}"
            exit 1
          fi
